name: Testar cadastro de usuários e turma

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'

    - name: Run Unit tests
      run: |
        python testes.py
